name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The site under test is live, so a nightly run catches regressions
  # that nobody pushed — an expired link, a CDN change, a broken deploy.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run end-to-end suite
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: https://zeevtapoohi.com

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload traces and screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
